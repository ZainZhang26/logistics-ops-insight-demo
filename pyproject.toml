[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-operations-demo"
version = "0.1.0"
description = "物流网点营运监控与证据化诊断 Demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.45,<2",
  "duckdb>=1.4,<2",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "plotly>=6,<7",
  "openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
